<style>
/* Layout: barra superior fixa com abas; conteúdo em faixa única de até 1200px; indicadores em tira, painéis abaixo. */
:root{
  --bg:#f2f3f0;--surface:#ffffff;--surface2:#e9ece7;--ink:#17201e;--muted:#5b6965;--line:#d8ddd7;
  --accent:#0f6b5c;--accent-soft:#dbeee9;--on-accent:#ffffff;
  --ok:#1b7f4b;--ok-soft:#dff1e6;--warn:#9a5b00;--warn-soft:#f9ebcf;--bad:#b3261e;--bad-soft:#f8dcd8;
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1514;--surface:#172120;--surface2:#212c2a;--ink:#e5ece9;--muted:#94a49f;--line:#2b3836;
  --accent:#4cc2a8;--accent-soft:#16332d;--on-accent:#06231d;
  --ok:#5fcf93;--ok-soft:#153325;--warn:#e8b04f;--warn-soft:#3a2e12;--bad:#ff8f86;--bad-soft:#3d1e1b;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1514;--surface:#172120;--surface2:#212c2a;--ink:#e5ece9;--muted:#94a49f;--line:#2b3836;
  --accent:#4cc2a8;--accent-soft:#16332d;--on-accent:#06231d;
  --ok:#5fcf93;--ok-soft:#153325;--warn:#e8b04f;--warn-soft:#3a2e12;--bad:#ff8f86;--bad-soft:#3d1e1b;color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);padding-bottom:48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:40}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.in{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.hd .in{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:10px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--muted);letter-spacing:0}
.nav{display:flex;gap:2px;overflow-x:auto;min-width:0}
.nav button{border:0;background:none;padding:8px 12px;border-radius:var(--r);cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.fresh{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}
.account-actions{display:flex;align-items:center;gap:10px;margin-left:12px}
.account-email{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12px}
main{padding-block:20px 40px}
h1{font-size:22px;line-height:1.2;margin:0 0 2px;letter-spacing:-.015em;text-wrap:balance}
h2{font-size:13px;margin:0 0 12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
h3{font-size:15px;margin:0}
.sub{color:var(--muted);margin:0 0 16px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn);border-radius:var(--r);padding:10px 14px;margin-bottom:16px}
.banner b{color:var(--warn)}
.banner .btn{margin-left:auto}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 13px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:3px 10px;font-size:13px}
input[type=search],input[type=text],input[type=number],input[type=date],select{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.grow{flex:1;min-width:180px}
.muted{color:var(--muted)}.small{font-size:12px}
.mono{font-family:var(--mono);font-size:13px}
.num{font-variant-numeric:tabular-nums}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.tile{background:var(--surface);padding:14px 16px;min-width:0}
.tile .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.tile .v{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.25;margin-top:2px}
.tile .v.bad{color:var(--bad)}
.tile .s{font-size:12px;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px;margin-bottom:16px}
.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px;margin-bottom:16px}
.chart-panel{overflow:hidden}
.chart-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.chart-heading h2{margin-bottom:0}
.chart-month{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;white-space:nowrap}
.chart-month select{max-width:140px;padding:4px 7px;font-size:12px}
.chart-presentation-open{overflow:hidden}
.chart-presentation-open .hd{display:none}
.chart-presentation-open #app{position:fixed;inset:0;z-index:70;width:100%;max-width:none;margin:0;padding:20px 24px 94px;overflow-y:auto;background:var(--bg)}
.chart-presentation-open #app>:not(.chart-grid){display:none!important}
.chart-presentation-open #app .chart-grid{display:block;width:min(1400px,100%);min-height:100%;margin:0 auto}
.chart-presentation-open #app .chart-panel{display:none}
.chart-presentation-open #app .chart-panel.presentation-current{display:flex;flex-direction:column;min-height:calc(100vh - 126px);padding:clamp(18px,3vw,36px)}
.chart-presentation-open #app .chart-panel h2{font-size:clamp(16px,2vw,22px)}
.chart-presentation-open #app .chart-panel>p{font-size:clamp(13px,1.4vw,17px);margin:10px 0 20px}
.chart-presentation-open #app .chart-panel .chart-svg{width:100%;height:clamp(260px,62vh,680px);min-height:0;flex:1}
.chart-presentation-open #app .chart-panel .chart-legend{font-size:14px;gap:12px 20px}
.chart-presentation-controls{position:fixed;inset:auto 0 0;z-index:80;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px max(24px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));background:var(--surface);border-top:1px solid var(--line)}
.chart-presentation-controls[hidden]{display:none}
.chart-presentation-controls .title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.chart-presentation-controls .group{display:flex;align-items:center;gap:8px}
.chart-presentation-controls .count{min-width:58px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
@media(max-width:620px){
  .chart-presentation-open #app{padding:12px 12px 130px}
  .chart-presentation-open #app .chart-panel.presentation-current{min-height:calc(100vh - 154px);padding:16px}
  .chart-presentation-open #app .chart-panel .chart-svg{height:48vh}
  .chart-presentation-controls{flex-wrap:wrap;justify-content:center;padding-inline:12px}
  .chart-presentation-controls .title{flex:1 0 100%;text-align:center}
  .chart-presentation-controls .group{gap:5px}
  .chart-presentation-controls .btn{padding:6px 9px}
}
.chart-svg{display:block;width:100%;height:auto;min-height:230px}
.chart-legend{display:flex;gap:8px 14px;flex-wrap:wrap;margin-top:8px}
.chart-legend span{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.chart-legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel.flush{padding:0}
.panel.flush>h2{padding:16px 16px 0}

.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.step{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;position:relative;min-width:0}
.step:not(:last-child)::after{content:"→";position:absolute;right:-10px;top:50%;transform:translate(50%,-50%);color:var(--muted);background:var(--surface);z-index:1;font-size:14px}
.step .n{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.step .l{font-size:12px;color:var(--muted)}
.step .c{font-size:11px;color:var(--accent);font-weight:600}
@media(max-width:620px){.flow{grid-template-columns:1fr 1fr}.step:nth-child(2)::after{display:none}}

.brow{display:grid;grid-template-columns:minmax(90px,170px) 1fr 84px;gap:10px;align-items:center;padding:4px 0}
.brow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .tr{height:10px;background:var(--surface2);border-radius:3px;overflow:hidden}
.brow .tr i{display:block;height:100%;background:var(--accent)}
.brow .vl{font-variant-numeric:tabular-nums;font-size:13px;min-width:70px;text-align:right}
.mcols{display:flex;align-items:flex-end;gap:8px;height:170px;border-bottom:1px solid var(--line)}
.mcol{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}
.mcol i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.mcol span{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.mlabels{display:flex;gap:8px;margin-top:4px}
.mlabels span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
@media(max-width:560px){.mcol span{display:none}}

.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.p-atrasado{background:var(--bad-soft);color:var(--bad)}
.p-aberto{background:var(--accent-soft);color:var(--accent)}
.p-parcial{background:var(--warn-soft);color:var(--warn)}
.p-entregue{background:var(--ok-soft);color:var(--ok)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.go{cursor:pointer}
tr.go:hover td{background:var(--surface2)}
th.r,td.r{text-align:right}
td.nw{white-space:nowrap}
td.cut{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{display:inline-block;width:70px;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;vertical-align:middle;margin-right:6px}
.mini i{display:block;height:100%;background:var(--ok)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip b{font-variant-numeric:tabular-nums;margin-left:4px;font-weight:600}
.list-row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.list-row:last-child{border-bottom:0}
button.list-row{cursor:pointer}
button.list-row:hover{background:var(--surface2)}
.list-row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--muted);padding:18px 4px;text-align:center}
.ds{display:grid;gap:16px}
.tag{font-family:var(--mono);font-size:11px;background:var(--surface2);border-radius:4px;padding:1px 6px;color:var(--muted)}
details{margin-top:10px}
summary{cursor:pointer;color:var(--accent);font-weight:500}
.map{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 14px;margin-top:10px}
.map label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.map select{width:100%;color:var(--ink);font-size:13px}
.map .lk{color:var(--accent);font-weight:600}
@media(max-width:560px){.map{grid-template-columns:1fr}}
.q{display:flex;gap:10px;align-items:baseline;padding:5px 0}
.q .d{width:9px;height:9px;border-radius:50%;flex:none;transform:translateY(-1px);background:var(--ok)}
.q.w .d{background:var(--warn)}
.q.b .d{background:var(--bad)}
.ov{position:fixed;inset:0;background:rgba(8,14,13,.55);z-index:50;overflow:auto;padding-block:max(4vh,env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dlg{background:var(--surface);border-radius:var(--r);max-width:860px;margin:0 auto;padding:20px;border:1px solid var(--line)}
.chain{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
@media(max-width:700px){.chain{grid-template-columns:1fr 1fr}}
.cs{border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;min-width:0}
.cs.off{border-style:dashed;color:var(--muted)}
.cs .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.cs .v{font-weight:600}
.cs .x{font-size:12px;color:var(--muted)}
.dlg h2{margin-top:18px}
#toast{position:fixed;left:0;right:0;bottom:max(20px,env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:60;pointer-events:none;padding-inline:16px}
#toast div{background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:var(--r);max-width:520px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
(()=>{
'use strict';

try{
  const session=JSON.parse(localStorage.getItem(AUTH_SESSION)||'null');
  const accounts=JSON.parse(localStorage.getItem(AUTH_ACCOUNTS)||'{}');
  if(session&&typeof session.email==='string'&&accounts[session.email.toLowerCase()])activeEmail=session.email.toLowerCase();
}catch(e){}
if(!activeEmail){location.replace('index.html');return}
const suffix=encodeURIComponent(activeEmail);

const pad=n=>String(n).padStart(2,'0');

const today=()=>ymd(new Date());
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};

const fdate=s=>s?s.split('-').reverse().join('/'):'—';
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const brl=n=>(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});

const norm=s=>String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');

 cot:{label:'Cotações',code:'SC8',hint:'Preços pedidos aos fornecedores. Liga com a solicitação.',fields:[
  ['num','Nº da cotação','k',['c8_num','n cotacao','numero cotacao','num cotacao','cotacao']],

/* ================= leitura de valores ================= */
const keyOf=v=>{if(v==null||v==='')return '';let s=String(v).trim().replace(/\.0+$/,'');return s.replace(/^0+(?=.)/,'')};
const txt=v=>v==null?'':String(v).trim();
const numOf=v=>{if(typeof v==='number')return isFinite(v)?v:0;let s=String(v==null?'':v).replace(/[R$\s]/g,'');if(!s)return 0;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if((s.match(/\./g)||[]).length>1)s=s.replace(/\./g,'');
  const n=parseFloat(s);return isFinite(n)?n:0};
function dateOf(v){
  if(v==null||v==='')return '';
  if(v instanceof Date&&!isNaN(v))return ymd(new Date(v.getTime()+12*36e5));
  if(typeof v==='number'){if(v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`}
    if(v>19000101&&v<21001231)v=String(v);else return ''}
  const s=String(v).trim();let m;
  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})/)))return `${m[1]}-${m[2]}-${m[3]}`;
  if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/))){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${pad(m[2])}-${pad(m[1])}`}
  if((m=s.match(/^(\d{4})(\d{2})(\d{2})$/)))return `${m[1]}-${m[2]}-${m[3]}`;
  return '';
}

function autoMap(headers,k){
  const hs=headers.map(norm),used=new Set(),map={},fs=DS[k].fields;
  for(const f of fs){const syn=f[3].map(norm);const i=hs.findIndex((h,j)=>!used.has(j)&&syn.includes(h));if(i>=0){map[f[0]]=i;used.add(i)}}
  for(const f of fs){if(map[f[0]]!=null)continue;const syn=f[3].map(norm).filter(s=>s.length>=4);let b=-1;
    hs.forEach((h,j)=>{if(b>=0||used.has(j)||h.length<4)return;if(syn.some(s=>h.includes(s)||s.includes(h)))b=j});
    if(b>=0){map[f[0]]=b;used.add(b)}}
  return map;
}

function build(k){
  const raw=S.raw[k],m=S.map[k]||{},fs=DS[k].fields,out=[];let skipped=0,bad=0;PAD[k]={};
  if(!raw){D[k]=[];BS[k]={skipped:0,bad:0};return}
  const idx={};fs.forEach(f=>{idx[f[0]]=m[f[0]]!=null&&m[f[0]]!==''?+m[f[0]]:-1});
  for(const r of raw.rows){
    const o={};
    for(const [f,,t] of fs){const v=idx[f]>=0?r[idx[f]]:'';
      if(t==='k'){o[f]=keyOf(v);const sv=txt(v);if(/^\d+$/.test(sv))PAD[k][f]=Math.max(PAD[k][f]||0,sv.length)}else if(t==='n')o[f]=numOf(v);
      else if(t==='d'){o[f]=dateOf(v);if(v!==''&&v!=null&&!o[f])bad++}else o[f]=txt(v)}
    if(!PK[k](o)){skipped++;continue}
    if('total' in o&&!o.total&&o.qtd&&o.preco)o.total=o.qtd*o.preco;
    if('total' in o&&!o.total&&k==='cot'&&o.preco)o.total=o.preco;
    if(k==='ped'){
      o.gross=o.gross||o.total;
      o.net=o.net||Math.max(0,o.gross-o.taxes);
      o.total=o.total||o.gross;
    }
    out.push(o);
  }
  D[k]=out;BS[k]={skipped,bad};
}

/* ================= modelo: liga SC → cotação → pedido → NF ================= */
function buildModel(){
  const T=today();
  const scMap=new Map();
  for(const r of D.sc){let s=scMap.get(r.num);if(!s){s={num:r.num,items:[],emissao:'',solicitante:'',cc:''};scMap.set(r.num,s)}
    s.items.push(r);if(r.emissao&&(!s.emissao||r.emissao<s.emissao))s.emissao=r.emissao;s.solicitante=s.solicitante||r.solicitante;s.cc=s.cc||r.cc}
  const cotByNum=new Map(),cotBySc=new Map();
  for(const c of D.cot){if(c.scNum){(cotBySc.get(c.scNum)||cotBySc.set(c.scNum,[]).get(c.scNum)).push(c)}
    if(c.num){(cotByNum.get(c.num)||cotByNum.set(c.num,[]).get(c.num)).push(c)}}
  const nfBy=new Map(),approvalBy=new Map();
  for(const n of D.nf){if(!n.pedNum)continue;(nfBy.get(n.pedNum)||nfBy.set(n.pedNum,[]).get(n.pedNum)).push(n)}
  for(const a of D.apr){if(!a.pedNum)continue;(approvalBy.get(a.pedNum)||approvalBy.set(a.pedNum,[]).get(a.pedNum)).push(a)}
  const pm=new Map();
  for(const r of D.ped){let p=pm.get(r.num);
    if(!p){p={num:r.num,items:[],scNum:'',cotNum:'',fornecedor:'',comprador:'',emissao:'',previsao:'',total:0,gross:0,taxes:0,net:0,qtd:0,qtdFile:0,payment:''}; pm.set(r.num,p)}
    p.items.push(r);p.total+=r.total;p.gross+=r.gross;p.taxes+=r.taxes;p.net+=r.net;p.qtd+=r.qtd;p.qtdFile+=r.qtdEnt;
    p.scNum=p.scNum||r.scNum;p.cotNum=p.cotNum||r.cotNum;p.fornecedor=p.fornecedor||r.fornecedor;p.comprador=p.comprador||r.comprador;
    p.payment=p.payment||r.payment;
    if(r.emissao&&(!p.emissao||r.emissao<p.emissao))p.emissao=r.emissao;
    if(r.previsao&&(!p.previsao||r.previsao>p.previsao))p.previsao=r.previsao}
  const peds=[...pm.values()];
  for(const p of peds){
    p.nfs=nfBy.get(p.num)||[];
    p.approvals=approvalBy.get(p.num)||[];
    const approvals=[...p.approvals].sort((a,b)=>(a.approvalDate||'').localeCompare(b.approvalDate||''));
    const lastApproval=approvals[approvals.length-1];
    p.approvalStatus=lastApproval?lastApproval.status:'';
    p.approver=lastApproval?lastApproval.approver:'';
    p.approvalDate=approvals.map(a=>a.approvalDate).filter(Boolean).pop()||'';
    p.approvalDays=p.approvalDate&&p.emissao?diff(p.approvalDate,p.emissao):null;
    const nfQty=p.nfs.reduce((a,n)=>a+n.qtd,0);
    p.entregue=Math.max(nfQty,p.qtdFile);
    const dts=p.nfs.map(n=>n.emissao).filter(Boolean).sort();
    p.firstNf=dts[0]||'';p.lastNf=dts[dts.length-1]||'';
    const done=p.qtd>0?p.entregue>=p.qtd*0.999:p.nfs.length>0;
    p.status=done?'entregue':(p.previsao&&p.previsao<T)?'atrasado':p.entregue>0?'parcial':'aberto';
    p.pct=p.qtd>0?Math.min(100,Math.round(p.entregue/p.qtd*100)):(done?100:0);
    p.saldo=p.qtd>0?p.total*Math.max(0,1-p.entregue/p.qtd):(done?0:p.total);
    p.atraso=p.status==='atrasado'?diff(T,p.previsao):(done&&p.lastNf&&p.previsao?diff(p.lastNf,p.previsao):null);
    p.noPrazo=done&&p.lastNf&&p.previsao?p.lastNf<=p.previsao:null;
    p.lead=p.firstNf&&p.emissao?diff(p.firstNf,p.emissao):null;
    const sc=scMap.get(p.scNum);p.scEmissao=sc?sc.emissao:'';
    p.ciclo=p.scEmissao&&p.emissao?diff(p.emissao,p.scEmissao):null;
  }
  const pedBySc=new Map();
  for(const p of peds){if(p.scNum)(pedBySc.get(p.scNum)||pedBySc.set(p.scNum,[]).get(p.scNum)).push(p)}
  for(const c of D.cot){if(c.pedNum&&pm.has(c.pedNum)&&c.scNum){const arr=pedBySc.get(c.scNum)||pedBySc.set(c.scNum,[]).get(c.scNum);const p=pm.get(c.pedNum);if(!arr.includes(p))arr.push(p)}}
  const scs=[...scMap.values()];
  for(const s of scs){s.peds=pedBySc.get(s.num)||[];s.hasCot=cotBySc.has(s.num);s.recebida=s.peds.some(p=>p.entregue>0);s.idade=s.emissao?diff(T,s.emissao):null}
  const forn=new Map();
  for(const p of peds){const k=p.fornecedor||'(sem fornecedor)';let f=forn.get(k);if(!f){f={nome:k,peds:[]};forn.set(k,f)}f.peds.push(p)}
  M={T,peds,pm,scs,scMap,cotBySc,cotByNum,nfBy,approvalBy,forn:[...forn.values()],pedBySc};
}

/* ================= leitura de arquivo ================= */
function parseCSV(text){
  const first=text.split(/\r?\n/,1)[0]||'';const cnt=c=>first.split(c).length-1;
  const d=[';','\t',',','|'].reduce((a,c)=>cnt(c)>cnt(a)?c:a,';');
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===d){row.push(f);f=''}
    else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}else if(c==='\r'){}else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows;
}
function toTable(rows){
  rows=rows.map(r=>r.map(c=>c instanceof Date?ymd(new Date(c.getTime()+12*36e5)):c));
  const filled=r=>r.filter(c=>c!==''&&c!=null).length;
  const head=rows.slice(0,20);const mx=Math.max(0,...head.map(filled));
  const hi=Math.max(0,head.findIndex(r=>filled(r)>=Math.max(2,Math.ceil(mx*0.6))));
  const headers=(rows[hi]||[]).map((h,i)=>txt(h)||`Coluna ${i+1}`);
  const body=rows.slice(hi+1).filter(r=>filled(r)>0).map(r=>headers.map((_,i)=>r[i]==null?'':r[i]));
  return {headers,rows:body};
}
async function readFile(file){
  const buf=await file.arrayBuffer();
  if(/\.csv$|\.txt$/i.test(file.name)){
    let t=new TextDecoder('utf-8').decode(buf);if(t.includes('\uFFFD'))t=new TextDecoder('windows-1252').decode(buf);
    return toTable(parseCSV(t.replace(/^﻿/,'')));
  }
  if(!window.XLSX)throw new Error('A biblioteca de leitura de Excel não carregou. Verifique a conexão e recarregue a página, ou salve a planilha como CSV.');
  const wb=XLSX.read(buf,{type:'array',cellDates:true});
  let best=null,bn=-1;
  for(const n of wb.SheetNames){const r=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''});if(r.length>bn){bn=r.length;best=r}}
  return toTable(best||[]);
}
async function loadFile(k,file){
  try{
    const t=await readFile(file);
    if(!t.headers.length||!t.rows.length){toast('O arquivo está vazio ou sem linhas de dados.');return}
    if(S.sample){S={...S,raw:{},map:{},meta:{},sample:false}}
    S.raw[k]=t;S.map[k]=autoMap(t.headers,k);S.meta[k]={name:file.name,when:new Date().toISOString()};
    persist();rebuild();render();
    const got=Object.keys(S.map[k]).length;
    toast(`${DS[k].label}: ${nf(t.rows.length)} linhas, ${got} de ${DS[k].fields.length} colunas reconhecidas.`);
  }catch(e){toast(e.message||'Não consegui ler o arquivo.')}
}

  const ri=(x,y)=>x+Math.floor(rnd()*(y-x+1));const T=today();const dd=s=>s.split('-').reverse().join('/');
  const sup=['Aços Vale do Paraíba Ltda','Metalúrgica Rio Claro','Distribuidora Santa Helena','Ferragens Bom Jesus','Embalagens Paulista','TecnoParafusos Comércio','Lubrificantes Norte Sul','Alvorada Suprimentos'];

  const sc=[],cot=[],ped=[],nfr=[];let pn=4500,nn=8100,cn=900;
  for(let i=0;i<78;i++){
    const num=String(1200+i).padStart(6,'0'),d0=addDays(T,-ri(2,165));
    const its=[...prods].sort(()=>rnd()-.5).slice(0,ri(1,2)).map(p=>({p,q:ri(4,160)}));
    const who=sol[ri(0,4)],cc=ccs[ri(0,3)];
    its.forEach((it,ix)=>sc.push([num,String(ix+1).padStart(2,'0'),it.p[0],it.p[1],it.q,dd(d0),who,cc]));
    if(rnd()>.9)continue;
    const cnum='C'+String(++cn).padStart(5,'0'),sups=[...sup].sort(()=>rnd()-.5).slice(0,3);
    const quotes=sups.map(s=>({s,f:.9+rnd()*.28,d:addDays(d0,ri(1,3))}));

      const nd=addDays(prev,ri(-9,4));
      if(nd<=T&&rnd()<.95){const part=rnd()<.1;nfr.push([String(++nn).padStart(6,'0'),'1',pnum,String(ix+1).padStart(2,'0'),win.s,it.p[0],part?Math.round(it.q*.6):it.q,+(pr*(part?Math.round(it.q*.6):it.q)).toFixed(2),dd(nd)])}});
  }
  return {
   sc:{headers:['Nº SC','Item','Produto','Descrição','Quantidade','Emissão','Solicitante','Centro de Custo'],rows:sc},

   nf:{headers:['Nota Fiscal','Série','Nº Pedido','Item Pedido','Fornecedor','Produto','Quantidade','Valor Total','Data de Entrada'],rows:nfr},

   fat:{headers:['Nº do Documento','Data do Faturamento','Valor Faturado'],rows:[]}};

function filteredPeds(){
  const q=norm(UI.q);let L=M.peds;
  L=L.filter(inPeriod);
  if(UI.status!=='todos')L=L.filter(p=>p.status===UI.status);
  if(UI.buyer)L=L.filter(p=>p.comprador===UI.buyer);
  if(UI.category)L=L.filter(p=>p.items.some(i=>categoryOf(i.produto)===UI.category));
  if(q)L=L.filter(p=>norm([p.num,dn('ped','num',p.num),p.fornecedor,dn('sc','num',p.scNum),p.scNum,p.comprador,p.items.map(i=>i.produto+' '+i.desc).join(' '),p.nfs.map(n=>n.doc+' '+dn('nf','doc',n.doc)).join(' ')].join(' ')).includes(q));
  const rank={atrasado:0,parcial:1,aberto:2,entregue:3};
  const S2={atraso:(a,b)=>rank[a.status]-rank[b.status]||(a.previsao||'9').localeCompare(b.previsao||'9'),
    recentes:(a,b)=>(b.emissao||'').localeCompare(a.emissao||''),valor:(a,b)=>b.total-a.total,previsao:(a,b)=>(a.previsao||'9').localeCompare(b.previsao||'9')};
  return [...L].sort(S2[UI.sort]);
}

function productSpend(){
  const products=new Map();
  for(const p of M.peds.filter(inPeriod))for(const item of p.items){
    const code=item.produto||'(sem código)',row=products.get(code)||{code,name:item.desc||code,category:categoryOf(code),spend:0,qty:0};
    row.spend+=item.total||item.preco*item.qtd;row.qty+=item.qtd;
    if(!row.name||row.name===code)row.name=item.desc||code;
    row.category=categoryOf(code);products.set(code,row);
  }
  return [...products.values()].sort((a,b)=>b.spend-a.spend);
}
function abcRows(rows){
  const sorted=[...rows].sort((a,b)=>b.spend-a.spend);
  const total=sorted.reduce((sum,row)=>sum+row.spend,0);
  let running=0;
  return sorted.map(row=>{
    const before=total?running/total:0;
    running+=row.spend;
    const cumulative=total?running/total:0;
    return {...row,cumulative,group:before<.8?'A':before<.95?'B':'C'};
  });
}

function syncChartPresentation(){
  const root=$('#chart-presentation-controls');
  if(!chartPresentation.active||UI.view!=='graficos'){
    root.hidden=true;
    root.innerHTML='';
    document.body.classList.remove('chart-presentation-open');
    return;
  }
  const panels=[...document.querySelectorAll('#app .chart-panel')];
  if(!panels.length){exitChartPresentation(false);return}
  chartPresentation.index=((chartPresentation.index%panels.length)+panels.length)%panels.length;
  panels.forEach((panel,index)=>panel.classList.toggle('presentation-current',index===chartPresentation.index));
  const title=panels[chartPresentation.index].querySelector('h2').textContent;
  root.innerHTML=`<span class="title">${esc(title)}</span><div class="group">
    <button class="btn" data-a="chart-presentation-prev" aria-label="Gráfico anterior">← Anterior</button>
    <span class="count">${chartPresentation.index+1} / ${panels.length}</span>
    <button class="btn pri" data-a="chart-presentation-pause">${chartPresentation.paused?'Continuar':'Pausar'}</button>
    <button class="btn" data-a="chart-presentation-next" aria-label="Próximo gráfico">Próximo →</button>
    <button class="btn" data-a="chart-presentation-exit">Sair Esc</button>
  </div>`;
  root.hidden=false;
  document.body.classList.add('chart-presentation-open');
}
function scheduleChartPresentation(){
  clearTimeout(chartPresentation.timer);
  if(!chartPresentation.active||chartPresentation.paused)return;
  chartPresentation.timer=setTimeout(()=>{
    chartPresentation.index++;
    render();
    scheduleChartPresentation();
  },CHART_PRESENTATION_MS);
}
function startChartPresentation(){
  if(UI.view!=='graficos')return;
  chartPresentation.active=true;
  chartPresentation.index=0;
  chartPresentation.paused=false;
  render();
  scheduleChartPresentation();
  $('#chart-presentation-controls [data-a="chart-presentation-prev"]').focus();
}
function moveChartPresentation(offset){
  const panels=document.querySelectorAll('#app .chart-panel');
  if(!panels.length)return;
  chartPresentation.index=(chartPresentation.index+offset+panels.length)%panels.length;
  render();
  scheduleChartPresentation();
}
function toggleChartPresentationPause(){
  chartPresentation.paused=!chartPresentation.paused;
  syncChartPresentation();
  scheduleChartPresentation();
}
function exitChartPresentation(restoreFocus=true){
  clearTimeout(chartPresentation.timer);
  chartPresentation.timer=0;
  chartPresentation.active=false;
  chartPresentation.paused=false;
  syncChartPresentation();
  if(restoreFocus)$('#app [data-a="chart-presentation-start"]')?.focus();
}

function qualityList(){
  const L=[];const add=(cls,t)=>L.push(`<div class="q ${cls}"><span class="d"></span><span>${t}</span></div>`);

  if(!D.sc.length)add('w','Sem solicitações carregadas: o fluxo completo e o tempo até o pedido não podem ser calculados.');
  else add(noSc?'w':'', noSc?`${noSc} pedidos sem solicitação encontrada. Compras diretas são normais, mas confira se o campo Nº da solicitação está no relatório.`:'Todos os pedidos têm solicitação ligada.');
  if(!D.nf.length)add('w','Sem notas fiscais carregadas: a situação de entrega só será calculada se o relatório de pedidos trouxer a quantidade entregue.');

  if(!D.fat.length)add('w','Sem relatório de faturamento: a comparação entre compras e faturamento não está disponível.');

function downloadCsv(filename,rows){
  const csv=rows.map(row=>row.map(value=>{
    const cell=String(value==null?'':value);
    return /[",\r\n]/.test(cell)?`"${cell.replace(/"/g,'""')}"`:cell;
  }).join(',')).join('\r\n');
  const blob=new Blob(['\uFEFF',csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const link=document.createElement('a');
  link.href=url;link.download=filename;link.hidden=true;
  document.body.appendChild(link);link.click();link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

  if(p.ciclo!=null)dur.push(`Solicitação → pedido: <b>${p.ciclo} dias</b>`);
  if(p.lead!=null)dur.push(`Pedido → 1ª nota: <b>${p.lead} dias</b>`);
  if(p.atraso!=null)dur.push(p.status==='atrasado'?`Atrasado há <b class="bad" style="color:var(--bad)">${p.atraso} dias</b> (previsto para ${fdate(p.previsao)})`:p.atraso>0?`Entregue com <b>${p.atraso} dias</b> de atraso`:`Entregue no prazo`);
  $('#modal').innerHTML=`<div class="ov" data-a="bg"><div class="dlg" role="dialog" aria-modal="true" aria-label="Pedido ${esc(dn('ped','num',p.num))}">
   <div class="row sb"><div><h3 style="font-size:19px">Pedido <span class="mono" style="font-size:18px">${esc(dn('ped','num',p.num))}</span> ${pill(p.status)}</h3><div class="muted">${esc(p.fornecedor||'Sem fornecedor')}${p.comprador?' · comprador '+esc(p.comprador):''}</div></div><button class="btn" data-a="close">Fechar</button></div>
   <div class="chain">
    ${sc?cs('','Solicitação',`<span class="mono">${esc(dn('sc','num',sc.num))}</span>`,`${fdate(sc.emissao)}${sc.solicitante?' · '+esc(sc.solicitante):''}`):cs('off','Solicitação',p.scNum?`<span class="mono">${esc(dn('sc','num',p.scNum))}</span>`:'não ligada',p.scNum?'não está no relatório de SC':'compra direta ou campo ausente')}
    ${cq.length?cs('','Cotações',`${cq.length} fornecedor${cq.length>1?'es':''}`,`menor: ${brlC(cq[0].t)}`):cs('off','Cotações','nenhuma','sem cotação ligada')}
    ${cs('','Pedido',brl(p.total),`${fdate(p.emissao)} → previsto ${fdate(p.previsao)}`)}
    ${p.nfs.length?cs('','Recebimento',`${p.nfs.length} nota${p.nfs.length>1?'s':''}`,`${p.pct}% recebido · última ${fdate(p.lastNf)}`):cs('off','Recebimento',p.entregue>0?`${p.pct}% recebido`:'nada recebido','sem nota fiscal ligada')}
   </div>
   ${dur.length?`<p style="margin:0">${dur.join(' &nbsp;·&nbsp; ')}</p>`:''}
   ${p.approvals.length?`<p class="small muted">Aprovação: ${esc(p.approvalStatus||'sem status')}${p.approver?' · '+esc(p.approver):''}${p.approvalDate?' · '+fdate(p.approvalDate):''}${p.approvalDays!=null?' · '+nf(p.approvalDays)+' dias':''}</p>`:''}
   <p class="small muted">Valores: bruto ${brl(p.gross)} · impostos ${brl(p.taxes)} · líquido ${brl(p.net)}${p.payment?' · pagamento: '+esc(p.payment):''}</p>
   <h2>Itens do pedido</h2><div class="tw"><table><thead><tr><th>Item</th><th>Produto</th><th class="r">Qtd.</th><th class="r">Preço un.</th><th class="r">Total</th></tr></thead><tbody>${p.items.map(i=>`<tr><td class="mono">${esc(i.item||'—')}</td><td>${esc(i.desc||i.produto||'—')}<div class="small muted mono">${esc(i.produto)}</div></td><td class="r num">${nf(i.qtd,2)}</td><td class="r nw num">${brl(i.preco)}</td><td class="r nw num">${brl(i.total)}</td></tr>`).join('')}</tbody></table></div>
   ${cq.length?`<h2>Cotações comparadas</h2><div class="tw"><table><thead><tr><th>Fornecedor</th><th class="r">Total cotado</th><th></th></tr></thead><tbody>${cq.map((c,i)=>`<tr><td>${esc(c.f)}</td><td class="r nw num">${brl(c.t)}</td><td>${norm(c.f)===norm(p.fornecedor)?'<span class="pill p-entregue">escolhida</span>':''}${i===0?' <span class="small muted">menor preço</span>':''}</td></tr>`).join('')}</tbody></table></div>`:''}
   ${p.nfs.length?`<h2>Notas fiscais de entrada</h2><div class="tw"><table><thead><tr><th>Nota</th><th>Entrada</th><th class="r">Qtd.</th><th class="r">Valor</th></tr></thead><tbody>${p.nfs.map(n=>`<tr><td class="mono">${esc(dn('nf','doc',n.doc))}${n.serie?'/'+esc(n.serie):''}</td><td class="num">${fdate(n.emissao)}</td><td class="r num">${nf(n.qtd,2)}</td><td class="r nw num">${brl(n.total)}</td></tr>`).join('')}</tbody></table></div>`:''}
  </div></div>`;
  document.body.style.overflow='hidden';
  const b=$('#modal [data-a=close]');if(b)b.focus();
}
function closeDetail(){$('#modal').innerHTML='';document.body.style.overflow=''}

/* ================= render e eventos ================= */
function render(){
  $('#nav').innerHTML=NAV.map(([v,l])=>`<button data-a="view" data-v="${v}"${UI.view===v?' aria-current="page"':''}>${l}</button>`).join('');
  $('#account-email').textContent=activeEmail;
  const ws=Object.values(S.meta).map(m=>m.when).filter(Boolean).sort();
  $('#fresh').textContent=hasData()&&!S.sample&&ws.length?`Dados carregados em ${new Date(ws[ws.length-1]).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}`:S.sample?'Exemplo':'Sem dados';
  const ban=S.sample&&UI.view!=='dados'?`<div class="banner"><span><b>Dados de exemplo.</b> Fornecedores e valores são fictícios. Carregue seus relatórios do Protheus para ver os números reais.</span><button class="btn pri sm" data-a="view" data-v="dados">Carregar meus dados</button></div>`:'';
  $('#app').innerHTML=ban+VIEWS[UI.view]();
  syncChartPresentation();
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;
  if(a==='bg'){if(e.target===el)closeDetail();return}
  const A={
   view:()=>{if(chartPresentation.active)exitChartPresentation(false);UI.view=el.dataset.v;UI.confirm=false;render();window.scrollTo(0,0)},
   'chart-presentation-start':startChartPresentation,
   'chart-presentation-prev':()=>moveChartPresentation(-1),
   'chart-presentation-next':()=>moveChartPresentation(1),
   'chart-presentation-pause':toggleChartPresentationPause,
   'chart-presentation-exit':()=>exitChartPresentation(),
   logout:()=>{localStorage.removeItem(AUTH_SESSION);location.replace('index.html')},
   open:()=>detail(el.dataset.id),close:closeDetail,
   status:()=>{UI.status=el.dataset.s;UI.limit=100;render()},
   goto:()=>{UI.view='pedidos';UI.status=el.dataset.s;UI.q='';UI.limit=100;render();window.scrollTo(0,0)},
   forn:()=>{UI.view='pedidos';UI.status='todos';UI.q=el.dataset.n;UI.limit=100;render();window.scrollTo(0,0)},
   more:()=>{UI.limit+=200;$('#pt').innerHTML=pedTable()},
   pick:()=>$('#f-'+el.dataset.k).click(),
   'export-csv':()=>exportCsv(el.dataset.k),
   'save-api':()=>{
    const value=$('#api-url').value.trim();
    if(value){try{const url=new URL(value);if(!['http:','https:'].includes(url.protocol))throw new Error();integration.apiUrl=url.href.replace(/\/+$/,'')}catch(e){toast('Informe uma URL válida começando com http:// ou https://.');return}}
    else integration.apiUrl='';
    if(persistIntegration()){render();toast('URL da API salva neste navegador. A conexão ainda não foi ativada.')}
   },
   'save-category':()=>{
    const product=$('#category-product').value,category=$('#category-name').value.trim();
    if(!product||!category){toast('Selecione um produto e informe a categoria.');return}
    S.categories[product]=category;persist();render();toast('Categoria do produto salva.');
   },
   'remove-category':()=>{
    delete S.categories[el.dataset.code];persist();render();toast('Categoria removida.');
   },
   'save-targets':()=>{
    const fields=[['otif','target-otif',0,100],['saving','target-saving',0,null],['approvalDays','target-approval',0,null]];
    const next={...S.targets};
    for(const [key,id,min,max] of fields){
      const raw=$('#'+id).value.trim();
      if(!raw){delete next[key];continue}
      const value=Number(raw);
      if(!Number.isFinite(value)||value<min||(max!=null&&value>max)){toast('Confira os valores das metas. OTIF deve estar entre 0 e 100; as demais metas não podem ser negativas.');return}
      next[key]=value;
    }
    S.targets=next;persist();render();toast('Metas salvas.');
   },
   'save-saving':()=>{
    const date=$('#saving-date').value,reference=Number($('#saving-reference').value),final=Number($('#saving-final').value);
    if(!date||$('#saving-reference').value===''||$('#saving-final').value===''||!Number.isFinite(reference)||!Number.isFinite(final)||reference<0||final<0){
      toast('Informe uma data e valores válidos para referência e preço fechado.');return;
    }
    S.savings=S.savings||[];
    S.savings.push({id:`${Date.now()}-${S.savings.length}`,date,order:$('#saving-order').value.trim(),supplier:$('#saving-supplier').value.trim(),category:$('#saving-category').value.trim(),buyer:$('#saving-buyer').value.trim(),reference,final});
    persist();render();toast('Saving registrado.');
   },
   'remove-saving':()=>{
    S.savings=(S.savings||[]).filter(s=>s.id!==el.dataset.id);persist();render();toast('Registro de saving removido.');
   },
   sample:()=>{loadSample();UI.view='geral';render();window.scrollTo(0,0)},
   clear:()=>{UI.confirm=true;render()},clearNo:()=>{UI.confirm=false;render()},
   'clear-no':()=>{UI.confirm=false;render()},
   'clear-yes':()=>{S={raw:{},map:{},meta:{},categories:{},targets:{},savings:[],sample:false};UI.confirm=false;persist();rebuild();render();toast('Dados apagados.')}
  };
  if(A[a])A[a]();
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.type==='file'&&el.files[0]){loadFile(el.dataset.k,el.files[0]);el.value='';return}
  const a=el.dataset&&el.dataset.a;
  if(a==='period'){UI.period=el.value;render()}
  else if(a==='chart-month'){UI.chartMonths[el.dataset.chart]=el.value;render()}
  else if(a==='sort'){UI.sort=el.value;$('#pt').innerHTML=pedTable()}
  else if(a==='buyer-filter'){UI.buyer=el.value;$('#pt').innerHTML=pedTable()}
  else if(a==='category-filter'){UI.category=el.value;$('#pt').innerHTML=pedTable()}
  else if(a==='map'){const k=el.dataset.k,f=el.dataset.f;S.map[k]=S.map[k]||{};if(el.value==='')delete S.map[k][f];else S.map[k][f]=+el.value;persist();rebuild();
    const open=[...document.querySelectorAll('details')].map(d=>d.open);render();document.querySelectorAll('details').forEach((d,i)=>d.open=!!open[i])}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){UI.q=e.target.value;UI.limit=100;$('#pt').innerHTML=pedTable()}});
document.addEventListener('keydown',e=>{
  if(chartPresentation.active){
    if(e.key==='Escape'){e.preventDefault();exitChartPresentation()}
    else if(e.key==='ArrowRight'){e.preventDefault();moveChartPresentation(1)}
    else if(e.key==='ArrowLeft'){e.preventDefault();moveChartPresentation(-1)}
    return;
  }
  if(e.key==='Escape'&&$('#modal .ov'))closeDetail();
});

/* ================= início ================= */
migrateLegacyData();
const saved=restore();
restoreIntegration();
if(saved){S=saved;if(!S.raw)S.raw={};if(!S.map)S.map={};if(!S.meta)S.meta={};if(!S.categories)S.categories={};if(!S.targets)S.targets={};if(!S.savings)S.savings=[];rebuild();if(!hasData()&&!Object.keys(S.raw).length)loadSample()}
else loadSample();
render();
})();
</script>

</body></html>
